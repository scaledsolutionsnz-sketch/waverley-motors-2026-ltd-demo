<!DOCTYPE html>
<html lang="en-NZ">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leave a Review | Waverley Motors 2026 Ltd</title>
<meta name="description" content="Tell us how we did. Rate your experience with Waverley Motors in Invercargill.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230b1220'/><text x='50' y='68' font-size='58' font-family='Arial' font-weight='bold' text-anchor='middle' fill='%23d7a03c'>W</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  .rate-wrap{min-height:100svh;display:grid;place-items:center;background:var(--bg);color:#fff;padding:120px 20px 60px;position:relative;overflow:hidden}
  .rate-wrap::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 0%,rgba(215,160,60,.18),transparent 55%)}
  .rate-card{position:relative;z-index:1;max-width:560px;width:100%;text-align:center}
  .rate-card h1{font-size:clamp(2rem,5vw,3rem);margin:18px 0 12px}
  .rate-card p{color:#9fabbe;margin-bottom:36px}
  .stars-pick{display:flex;justify-content:center;gap:10px;margin-bottom:30px}
  .star-btn{font-size:clamp(2.6rem,9vw,3.6rem);line-height:1;background:none;border:0;cursor:pointer;color:#33405a;transition:transform .2s var(--ease),color .2s}
  .star-btn:hover{transform:scale(1.15)}
  .star-btn.lit{color:var(--accent-2)}
  .rate-hint{font-size:.9rem;color:#8493a8;min-height:1.4em}
  .back-link{display:inline-block;margin-top:34px;color:#9fabbe;font-size:.9rem}
  .back-link:hover{color:#fff}
</style>
</head>
<body>
<div class="rate-wrap">
  <div class="rate-card">
    <a href="index.html" class="brand" style="justify-content:center;margin-bottom:8px"><span class="mark">W</span><span>Waverley Motors</span></a>
    <h1>How did we do?</h1>
    <p>Your feedback keeps us sharp. Tap a star to rate your experience with Waverley Motors.</p>
    <div class="stars-pick" id="stars">
      <button class="star-btn" data-v="1" aria-label="1 star">★</button>
      <button class="star-btn" data-v="2" aria-label="2 stars">★</button>
      <button class="star-btn" data-v="3" aria-label="3 stars">★</button>
      <button class="star-btn" data-v="4" aria-label="4 stars">★</button>
      <button class="star-btn" data-v="5" aria-label="5 stars">★</button>
    </div>
    <div class="rate-hint" id="hint">Tap to rate</div>
    <a href="index.html" class="back-link">← Back to website</a>
  </div>
</div>
<script>
  // 4-5 stars -> Google review; 1-3 stars -> private feedback form
  var GOOGLE_REVIEW_URL = "https://g.page/r/PLACEHOLDER";
  var stars = document.querySelectorAll('.star-btn');
  var hint = document.getElementById('hint');
  var labels = ['','We’d love to make this right','Tell us what went wrong','Help us improve','Great — thanks!','Awesome — thank you!'];
  stars.forEach(function(btn){
    btn.addEventListener('mouseenter', function(){ paint(+btn.dataset.v); });
    btn.addEventListener('click', function(){
      var v = +btn.dataset.v;
      paint(v);
      hint.textContent = labels[v];
      setTimeout(function(){
        if (v >= 4) { window.location.href = GOOGLE_REVIEW_URL; }
        else { window.location.href = 'private.html?rating=' + v; }
      }, 380);
    });
  });
  document.getElementById('stars').addEventListener('mouseleave', function(){ paint(0); });
  function paint(n){ stars.forEach(function(s){ s.classList.toggle('lit', +s.dataset.v <= n); }); }
</script>
</body>
</html>
